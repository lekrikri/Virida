[database]
DB_TYPE = postgres
HOST = localhost
NAME = ${POSTGRESQL_ADDON_DB}
USER = ${POSTGRESQL_ADDON_USER}
PASSWD = ${POSTGRESQL_ADDON_PASSWORD}
SSL_MODE = require
CHARSET = utf8
PATH = ${CC_PGPOOL_SOCKET_PATH}

# Optimisation connexions pour Clever Cloud
MAX_OPEN_CONNS = 5
MAX_IDLE_CONNS = 2
CONN_MAX_LIFETIME = 3s

[server]
HTTP_PORT = 8080
ROOT_URL = https://your-gitea-app.cleverapps.io
DISABLE_SSH = true

[repository]
ROOT = /home/bas/app_data/gitea-repositories

[log]
MODE = console
LEVEL = Info

[security]
INSTALL_LOCK = true
SECRET_KEY = ${GITEA_SECRET_KEY}

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = true
